name: kjllin-toolbox-build

on:
  push:
    branches: [polaris]
    paths:
      - ".github/workflows/kjllin-toolbox-build.yml"
      - "branding/**"
      - "src/**"
      - "UniGetUI.iss"
      - "global.json"
  workflow_dispatch:

concurrency:
  group: toolbox-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUGET_PACKAGES: ${{ github.workspace }}\\.nuget\\packages
  NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}\\.nuget\\http-cache

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'src/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Restore
        working-directory: src
        run: dotnet restore UniGetUI.Windows.slnx

      - name: Build, publish and package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Platform x64 -SkipTests -MaxInstallerCompression

      - name: Rename artifacts
        shell: pwsh
        run: |
          $out = "output"
          if (Test-Path "$out/UniGetUI.x64.zip") {
            Move-Item "$out/UniGetUI.x64.zip" "$out/KJLLin.Toolbox.x64.zip" -Force
          }
          if (Test-Path "$out/UniGetUI.Installer.x64.exe") {
            Move-Item "$out/UniGetUI.Installer.x64.exe" "$out/KJLLin.Toolbox.Installer.x64.exe" -Force
          }
          Get-ChildItem $out -File | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kjllin-toolbox-win-x64
          path: output/**
          if-no-files-found: error
