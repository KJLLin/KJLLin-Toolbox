name: kjllin-toolbox-build

on:
  push:
    branches: [polaris]
    paths:
      - ".github/workflows/kjllin-toolbox-build.yml"
      - "branding/**"
      - "InstallerExtras/**"
      - "src/**"
      - "UniGetUI.iss"
      - "global.json"
  workflow_dispatch:

concurrency:
  group: toolbox-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NUGET_PACKAGES: ${{ github.workspace }}\\.nuget\\packages
  NUGET_HTTP_CACHE_PATH: ${{ github.workspace }}\\.nuget\\http-cache

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('global.json', 'src/**/*.csproj', 'src/**/*.props', 'src/**/*.targets', 'src/**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: Bundle Scoop installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path InstallerExtras | Out-Null
          Invoke-WebRequest -Uri "https://get.scoop.sh" -OutFile "InstallerExtras/scoop-install.ps1" -UseBasicParsing

      - name: Restore
        working-directory: src
        run: dotnet restore UniGetUI.Windows.slnx

      - name: Build, publish and package
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release -Platform x64 -SkipTests -MaxInstallerCompression

      - name: Rename artifacts
        shell: pwsh
        run: |
          $out = "output"
          if (Test-Path "$out/UniGetUI.x64.zip") {
            Move-Item "$out/UniGetUI.x64.zip" "$out/KJLLin.Toolbox.x64.zip" -Force
          }
          if (Test-Path "$out/UniGetUI.Installer.x64.exe") {
            Move-Item "$out/UniGetUI.Installer.x64.exe" "$out/KJLLin.Toolbox.Installer.x64.exe" -Force
          }
          if (Test-Path "$out/checksums.x64.txt") { Remove-Item "$out/checksums.x64.txt" -Force }
          Get-ChildItem $out -File | Where-Object { $_.Name -notlike "checksums.*.txt" } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Tee-Object -FilePath "$out/checksums.x64.txt" -Append
          }
          Get-ChildItem $out -File | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kjllin-toolbox-win-x64
          path: output/**
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # A deleted release can still hold its tag for a moment, and two builds
          # can overlap; both paths must end with an updated nightly, never a failure.
          gh release delete nightly --yes --cleanup-tag 2>$null
          Start-Sleep -Seconds 3
          $notes = "由 GitHub Actions 自动构建，未签名，首次运行需允许 SmartScreen。build #${{ github.run_number }}，commit ${{ github.sha }}。"
          gh release create nightly output/* --title "KJLLin Toolbox 自动构建" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) {
            Write-Host "nightly still exists, uploading into it instead"
            gh release upload nightly output/* --clobber
            gh release edit nightly --title "KJLLin Toolbox 自动构建" --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
