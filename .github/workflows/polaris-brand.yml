name: kjllin-toolbox-brand

on:
  push:
    branches: [polaris]
    paths:
      - "branding/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore upstream language keys
        run: git checkout origin/main -- src/Languages

      - name: Apply KJLLin Toolbox branding
        run: python branding/apply_brand.py --apply

      - name: Patch installer and start page
        run: python branding/patch_installer.py --apply

      - name: Patch Scoop source scoping
        run: python branding/patch_sources.py --apply

      - name: Patch curated catalog
        run: python branding/patch_curation.py --apply

      - name: Patch package manager set
        run: python branding/patch_managers.py --apply

      - name: Remove legacy package managers
        run: python branding/remove_legacy_managers.py

      - name: Patch uninstall request hooks
        run: python branding/patch_uninstall_hooks.py --apply

      - name: Patch curated catalog source
        run: python branding/patch_curated_remote.py --apply

      - name: Patch developer options
        run: python branding/patch_developer_mode.py --apply

      - name: Bundle the Scoop installer
        run: python branding/patch_scoop_bundle.py --apply

      - name: Verify
        run: python branding/apply_brand.py --verify

      - name: Commit result
        run: |
          git config user.name "polaris-bot"
          git config user.email "polaris-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "chore(brand): apply KJLLin Toolbox branding [skip ci]"
          git push
